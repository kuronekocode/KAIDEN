name: Validate Data

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'packages/core/**'
  pull_request:
    branches: [main]
    paths:
      - 'data/**'
      - 'packages/core/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build core package
        run: pnpm --filter @kaiden/core build
      
      - name: Validate schemas
        run: pnpm validate:schemas
      
      - name: Validate data
        run: pnpm validate:data
